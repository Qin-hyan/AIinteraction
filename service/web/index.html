<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 05 语音控制台 — PC 录音与 ASR 状态</title>
<style>
  :root { --ok:#0a7d33; --warn:#b25e00; --bad:#c62828; --info:#1565c0; --bg:#f5f7fa; --card:#ffffff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:#1c2733; }
  header { background:#123a5c; color:#fff; padding:14px 20px; }
  header h1 { margin:0; font-size:20px; }
  header p  { margin:4px 0 0; font-size:12px; opacity:.85; }
  main { max-width:820px; margin:16px auto; padding:0 16px 40px; }
  .card { background:var(--card); border:1px solid #e0e6ee; border-radius:8px; padding:14px 16px; margin:12px 0; }
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  button { font-size:16px; padding:10px 22px; border:0; border-radius:6px; cursor:pointer; color:#fff; transition:opacity .15s; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #toggleBtn { background:var(--info); }
  #toggleBtn.stop { background:var(--bad); }
  #refreshBtn { background:#546e7a; }
  dl.grid { display:grid; grid-template-columns:120px 1fr; gap:6px 12px; margin:0; font-size:14px; }
  dt { color:#5b6b7a; }
  dd { margin:0; }
  .badge { display:inline-block; padding:2px 10px; border-radius:10px; font-size:12px; color:#fff; }
  .badge.idle { background:#78909c; }
  .badge.recording { background:var(--bad); animation:pulse 1.2s infinite; }
  .badge.pending,.badge.running { background:var(--info); animation:pulse 1.2s infinite; }
  .badge.success { background:var(--ok); }
  .badge.failed { background:var(--bad); }
  @keyframes pulse { 50% { opacity:.55; } }
  #asrText { background:#eef4fb; border:1px solid #cfe0f0; border-radius:6px; padding:8px 10px; margin-top:8px; min-height:34px; white-space:pre-wrap; word-break:break-all; }
  #banner { position:fixed; top:0; left:0; right:0; padding:10px 16px; font-size:14px; color:#fff; display:none; z-index:10; }
  #banner.error { background:var(--bad); display:block; }
  #banner.success { background:var(--ok); display:block; }
  #banner.info { background:var(--info); display:block; }
  #meta { font-size:12px; color:#7a8895; }
  .note { font-size:13px; color:#5b6b7a; background:#fbf3e8; border:1px solid #f0d9b5; border-radius:6px; padding:8px 10px; }
</style>
</head>
<body>
<header>
  <h1>Week 05 语音控制台</h1>
  <p>PC 录音控制 · 本地 Whisper 识别 · 与 ESP32 PLAY 物理按键共用同一份真实录音状态</p>
</header>

<div id="banner" role="status" aria-live="polite"></div>

<main>
  <div class="card controls">
    <button id="toggleBtn" disabled>开始录音</button>
    <button id="refreshBtn">刷新状态</button>
    <span id="meta"></span>
  </div>

  <div class="note">
    提示：网页与 ESP32 物理 PLAY 按键共用 <code>GET /api/voice/status</code> 报告的唯一录音状态，
    同一时刻只能有一个开始操作成功（重复启动会收到 409）。网页只显示服务端真实返回值，不模拟数据。
  </div>

  <div class="card">
    <h2>录音状态</h2>
    <dl class="grid">
      <dt>当前状态</dt><dd><span id="state" class="badge idle">…</span></dd>
      <dt>服务连接</dt><dd id="conn">检测中…</dd>
      <dt>已采帧数</dt><dd id="frames">…</dd>
      <dt>已录时长</dt><dd id="elapsed">… 秒</dd>
      <dt>目标文件</dt><dd id="targetPath">…</dd>
      <dt>上次录音</dt><dd id="lastRecording">…</dd>
      <dt>录音参数</dt><dd id="config">…</dd>
    </dl>
  </div>

  <div class="card">
    <h2>语音识别（ASR）</h2>
    <dl class="grid">
      <dt>处理状态</dt><dd><span id="asrStatus" class="badge idle">…</span></dd>
      <dt>关联音频</dt><dd id="asrWav">…</dd>
      <dt>识别文本</dt><dd id="asrText">（尚无识别文本）</dd>
      <dt>推理配置</dt><dd id="asrMeta">…</dd>
      <dt>错误信息</dt><dd id="asrError">…</dd>
    </dl>
  </div>
</main>

<script>
"use strict";

var API_START  = "/api/voice/start";    // POST 开始录音
var API_STOP   = "/api/voice/stop";     // POST 停止录音
var API_STATUS = "/api/voice/status";   // GET  状态轮询

var POLL_MS = 1000;            // 轮询间隔：兼顾 ESP32 按键与网页双入口共享状态
var state = { recording:false }; // 最近一次服务端确认的状态（服务端为准，不本地臆造）
var busy = false;                // 请求在途标志：防止重复点击 / 双启动
var pollSeq = 0;                 // 轮询序号：防止乱序响应覆盖新数据

function $(id){ return document.getElementById(id); }

function setBanner(kind, text){
  var b = $("banner");
  b.className = kind;
  b.textContent = text;
  if (text) {
    clearTimeout(b._t);
    b._t = setTimeout(function(){ b.className = ""; }, kind === "error" ? 6000 : 3000);
  }
}

function setBusy(b){
  busy = b;
  $("toggleBtn").disabled = b;
  $("refreshBtn").disabled = b;
}

function asrStatusText(s){
  return { idle:"尚无识别任务", pending:"已提交，等待处理…", running:"识别中…",
           success:"识别完成", failed:"识别失败" }[s] || (s || "…");
}

function renderStatus(httpStatus, body){
  $("conn").textContent = body && body.ok ? ("已连接（HTTP " + httpStatus + "）") : ("异常（HTTP " + httpStatus + "）");
  if (!body) return;

  if (body.hasOwnProperty("state"))  state = { recording: !!body.recording };
  var rec = !!body.recording;

  // 录音状态
  setBadge("state", rec ? "recording" : "idle", rec ? "录音中" : "空闲");
  $("frames").textContent = (body.frames_recorded === undefined) ? "…" : body.frames_recorded;
  $("elapsed").textContent = (body.elapsed_seconds === undefined) ? "…" : (body.elapsed_seconds + " 秒");
  $("targetPath").textContent = body.target_path || "（无进行中录音）";
  $("lastRecording").textContent = body.last_recording
    ? (body.last_recording.path + " · " + body.last_recording.duration_seconds + "s · " +
       body.last_recording.frames + " 帧")
    : "（无）";
  $("config").textContent = body.config
    ? (body.config.samplerate + "Hz / " + body.config.channels + "ch / " + body.config.dtype +
       " / device=" + body.config.device)
    : "…";

  // ASR 状态（只读快照，来自服务端）
  var asr = body.asr || {};
  setBadge("asrStatus", asr.status || "idle", asrStatusText(asr.status));
  $("asrWav").textContent = asr.wav_path || "…";
  $("asrText").textContent = (asr.status === "success")
      ? (asr.text || "（识别文本为空）")
      : (asr.status === "failed" ? "（识别失败，见下方错误信息）" : "（尚无有效识别文本）");
  $("asrMeta").textContent = asr.model
      ? (asr.model + " / " + asr.language + " / " + asr.task + " / " + asr.device +
         (asr.duration_seconds != null ? " · 推理 " + asr.duration_seconds + "s" : ""))
      : "…";
  $("asrError").textContent = asr.error || "…";

  // 操作按钮：按服务端真实状态决定（网页与物理按键共用）
  var btn = $("toggleBtn");
  if (rec) { btn.textContent = "停止录音"; btn.className = "stop"; }
  else     { btn.textContent = "开始录音"; btn.className = ""; }
  btn.disabled = busy;
}

function setBadge(id, key, text){
  var el = $(id);
  el.className = "badge " + (key || "idle");
  el.textContent = text;
}

function buildErrorText(httpStatus, body){
  if (body && body.message) return "服务返回 " + httpStatus + "：" + body.message;
  return "服务返回 HTTP " + httpStatus + "（无法解析响应体）";
}

function refresh(){
  var seq = ++pollSeq;
  fetch(API_STATUS, { method:"GET", headers:{ "Accept":"application/json" } })
    .then(function(resp){
      return resp.json().then(function(body){ return { status:resp.status, body:body }; })
        .catch(function(){ return { status:resp.status, body:null }; });
    })
    .then(function(result){
      if (seq !== pollSeq) return;              // 丢弃乱序/过期响应
      if (!result.body || result.body.ok === false) {
        setBanner("error", "服务状态异常：" + (result.body && result.body.message
          ? result.body.message : ("HTTP " + result.status)));
      }
      renderStatus(result.status, result.body);
      $("meta").textContent = "最近更新 " + new Date().toTimeString().slice(0,8);
    })
    .catch(function(err){
      if (seq !== pollSeq) return;
      setBanner("error", "无法连接语音服务：" + err.message);
    });
}

function toggle(){
  if (busy) return;                             // 防重复点击
  var action = state.recording ? "stop" : "start";
  var url = action === "start" ? API_START : API_STOP;
  setBusy(true);                                // 请求在途：锁定按钮
  setBanner("info", action === "start" ? "正在请求开始录音…" : "正在请求停止录音…");
  fetch(url, { method:"POST", headers:{ "Accept":"application/json" } })
    .then(function(resp){
      return resp.json().then(function(body){ return { status:resp.status, body:body }; })
        .catch(function(){ return { status:resp.status, body:null }; });
    })
    .then(function(result){
      var body = result.body;
      if (result.status === 200 && body && body.ok) {
        setBanner("success", "服务已受理：" + (action === "start" ? "开始录音，state=recording" : "停止录音，state=" + body.state));
      } else {
        setBanner("error", buildErrorText(result.status, body));
      }
    })
    .catch(function(err){
      setBanner("error", "请求失败（" + action + "）：" + err.message);
    })
    .then(function(){
      setBusy(false);
      refresh();                                // 无论成败立即与服务端状态对齐
    });
}

$("toggleBtn").addEventListener("click", toggle);
$("refreshBtn").addEventListener("click", refresh);

// 页面可见时保持轮询；不可见时暂停，避免无谓请求
document.addEventListener("visibilitychange", function(){
  if (document.hidden) { clearInterval(window._pollTimer); window._pollTimer = null; }
  else if (!window._pollTimer) { refresh(); window._pollTimer = setInterval(refresh, POLL_MS); }
});

refresh();
window._pollTimer = setInterval(refresh, POLL_MS);
</script>
</body>
</html>
